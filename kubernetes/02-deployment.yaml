apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-helloworld
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-boot-helloworld
  template:
    metadata:
      labels:
        app: spring-boot-helloworld
    spec:
      containers:
        - name: spring-boot-helloworld
          #image: harbor.wang.org/example/spring-boot-helloworld:2
          image: __IMAGE__
          imagePullPolicy: Always
          resources:
            limits:
              memory: "500Mi"
              cpu: "500m"
            requests:
              memory: "500Mi"
              cpu: "500m"
          ports:
            - name: httpport
              containerPort: 8888
