apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-boot-helloworld
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
  - host: myapp.wang.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: spring-boot-helloworld
            port:
              number: 8888

