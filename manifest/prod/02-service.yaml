---
kind: Service
apiVersion: v1
metadata:
  name: spring-boot-helloworld
  namespace: prod
  labels:
    app: spring-boot-helloworld
spec:
  #type: NodePort
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      #nodePort: 30666
  selector:
    app: spring-boot-helloworld
