apiVersion: v1
kind: Service
metadata:
  name: spring-boot-helloworld
  namespace: default
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path:   /
      prometheus.io/port:   '8888'
spec:
  selector: 
    app: spring-boot-helloworld
  type: LoadBalancer
  ports:
    - name: httpport
      port: 80
      targetPort: 80
      #nodePort: 32000
