apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

namespace: prod

replicas:
- name: spring-boot-helloworld
  count: 3

images:
- name: registry.cn-beijing.aliyuncs.com/wangxiaochun/spring-boot-helloworld
  newName: registry.cn-beijing.aliyuncs.com/wangxiaochun/spring-boot-helloworld
  newTag: v1.0

patches:
- target:
    kind: Deployment
    name: spring-boot-helloworld
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: spring-boot-helloworld
    spec:
      template:
        spec:
          containers:
          - name: spring-boot-helloworld
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
              limits:
                cpu: "1"
                memory: 2Gi
